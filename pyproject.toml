[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "woninet"
version = "2.2.0"
description = "A Python-based ARP+ICMP network monitoring tool"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

authors = [
    { name = "Alireza Teymuri", email = "teymuri.alireza98@gmail.com" }
]

keywords = [
    "network",
    "network-monitoring",
    "icmp",
    "arp",
]

dependencies = [
    "icmplib>=3.0.4,<3.1",
    "fastapi>=0.136.0,<0.137",
    "Jinja2>=3.1.6,<3.2",
    "uvicorn>=0.44.0,<0.45",
    "PyYAML>=6.0.3,<6.1",
    "SQLAlchemy>=2.0.46,<2.1",
    "python-multipart==0.0.32",
    "fastapi-swagger>=0.4.64,<0.5",
    "psycopg[binary]>=3.3.8,<3.4",
    "pydantic-settings>=2.16.2,<2.17",
]

[tool.setuptools.packages.find]
include = ["woninet*"]

[tool.setuptools.package-data]
woninet = [
    "server/static/**/*",
    "server/templates/**/*",
    "logging.yaml",
]

[project.urls]
Homepage = "https://github.com/woninet/woninet"
Documentation = "https://github.com/woninet/woninet/tree/main/docs"
Repository = "https://github.com/woninet/woninet"
Issues = "https://github.com/woninet/woninet/issues"
Changelog = "https://github.com/woninet/woninet/blob/main/CHANGELOG.md"

[project.scripts]
woninet = "woninet.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<9.2",
    "httpx2>=2.16.0,<2.17",
    "ruff>=0.15.11,<0.16",
]